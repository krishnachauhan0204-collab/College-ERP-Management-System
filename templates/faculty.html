<!DOCTYPE html>
<html>
<head>
    <title>Faculty Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Faculty Management</h1>

    <p>Manage College Faculty Records</p>

    <br>

    <a href="/add-faculty">
        <button>Add Faculty</button>
    </a>

    <h2>Faculty List</h2>

    {% if faculty %}
        <table border="1" cellpadding="10">
            <tr>
                <th>ID</th>
                <th>Faculty Name</th>
                <th>Department</th>
                <th>Email</th>
            </tr>

            {% for member in faculty %}
            <tr>
                <td>{{ member[0] }}</td>
                <td>{{ member[1] }}</td>
                <td>{{ member[2] }}</td>
                <td>{{ member[3] }}</td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>No faculty records available.</p>
    {% endif %}

    <br>

    <a href="/">⬅ Back to Dashboard</a>

</body>
</html>
