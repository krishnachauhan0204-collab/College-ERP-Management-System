<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Management</title>
</head>

<body>

    <h1>Faculty Management</h1>

    <a href="/add-faculty">
        <button type="button">Add Faculty</button>
    </a>

    <hr>

    <h2>Faculty Records</h2>

    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Faculty ID</th>
            <th>Department</th>
            <th>Email</th>
            <th>Action</th>
        </tr>

        {% for faculty in faculties %}
        <tr>
            <td>{{ faculty[0] }}</td>
            <td>{{ faculty[1] }}</td>
            <td>{{ faculty[2] }}</td>
            <td>{{ faculty[3] }}</td>
            <td>{{ faculty[4] }}</td>

            <td>
                <a href="/edit-faculty/{{ faculty[0] }}">Edit</a>
                |
                <a href="/delete-faculty/{{ faculty[0] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}

    </table>

    <br>

    <a href="/">Back to Dashboard</a>

</body>
</html>
