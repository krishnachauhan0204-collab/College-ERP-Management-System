<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Faculty</title>
</head>

<body>

    <h1>Edit Faculty</h1>

    <form method="POST" action="/edit-faculty/{{ faculty[0] }}">

        <label>Faculty Name:</label><br>
        <input type="text" name="name" value="{{ faculty[1] }}" required>
        <br><br>

        <label>Faculty ID:</label><br>
        <input type="text" name="faculty_id" value="{{ faculty[2] }}" required>
        <br><br>

        <label>Department:</label><br>
        <input type="text" name="department" value="{{ faculty[3] }}" required>
        <br><br>

        <label>Email:</label><br>
        <input type="email" name="email" value="{{ faculty[4] }}" required>
        <br><br>

        <button type="submit">Update Faculty</button>

    </form>

    <br>

    <a href="/faculty">Back to Faculty Management</a>

</body>
</html>
