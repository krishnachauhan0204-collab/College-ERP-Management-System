<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses & Subjects</title>
</head>

<body>

    <h1>Courses & Subjects</h1>

    <a href="/add-course">
        <button type="button">Add Course / Subject</button>
    </a>

    <hr>

    <h2>Course / Subject Records</h2>

    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>Department</th>
            <th>Course / Subject Name</th>
            <th>Course Code</th>
            <th>Semester</th>
            <th>Action</th>
        </tr>

        {% for course in courses %}
        <tr>
            <td>{{ course[0] }}</td>
            <td>{{ course[3] }}</td>
            <td>{{ course[1] }}</td>
            <td>{{ course[2] }}</td>
            <td>{{ course[4] }}</td>

            <td>
                <a href="/edit-course/{{ course[0] }}">Edit</a>
                |
                <a href="/delete-course/{{ course[0] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}

    </table>

    <br>

    <a href="/">Back to Dashboard</a>

</body>
</html>
