<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fees Management</title>
</head>

<body>

    <h1>Fees Management</h1>

    <a href="/add-fee">
        <button type="button">Add Fee Record</button>
    </a>

    <hr>

    <h2>Fee Records</h2>

    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>Student Name</th>
            <th>Enrollment Number</th>
            <th>Course</th>
            <th>Total Fees</th>
            <th>Paid Fees</th>
            <th>Pending Fees</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        {% for fee in fees %}
        <tr>
            <td>{{ fee[0] }}</td>
            <td>{{ fee[1] }}</td>
            <td>{{ fee[2] }}</td>
            <td>{{ fee[3] }}</td>
            <td>₹{{ fee[4] }}</td>
            <td>₹{{ fee[5] }}</td>
            <td>₹{{ fee[6] }}</td>
            <td>{{ fee[7] }}</td>

            <td>
                <a href="/edit-fee/{{ fee[0] }}">Edit</a>
                |
                <a href="/delete-fee/{{ fee[0] }}">Delete</a>
            </td>
        </tr>
        {% endfor %}

    </table>

    <br>

    <a href="/">Back to Dashboard</a>

</body>
</html>
