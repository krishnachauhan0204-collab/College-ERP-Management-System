<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
</head>

<body>

    <h1>Student Management</h1>

    <a href="/add-student">
        <button type="button">Add Student</button>
    </a>

    <p>Manage college students here.</p>

    <hr>

    <h2>Student List</h2>

    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Enrollment Number</th>
            <th>Course</th>
            <th>Email</th>
            <th>Action</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td>{{ student[4] }}</td>
            <td>
                <td>
    <a href="/edit-student/{{ student[0] }}">Edit</a>
    |
    <a href="/delete-student/{{ student[0] }}">Delete</a>
</td>
        </tr>
        {% endfor %}

    </table>

    <br>

    <a href="/">Back to Dashboard</a>

</body>
</html>
