<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Faculty</title>
</head>

<body>

    <h1>Add Faculty</h1>

    <form method="POST" action="/add-faculty">

        <label>Faculty Name:</label><br>
        <input type="text" name="name" required>
        <br><br>

        <label>Faculty ID:</label><br>
        <input type="text" name="faculty_id" required>
        <br><br>

        <label>Department:</label><br>
        <input type="text" name="department" required>
        <br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required>
        <br><br>

        <button type="submit">Save Faculty</button>

    </form>

    <br>

    <a href="/faculty">Back to Faculty Management</a>

</body>
</html>
