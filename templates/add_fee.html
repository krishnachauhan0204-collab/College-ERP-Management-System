<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Fee Record</title>
</head>

<body>

    <h1>Add Fee Record</h1>

    <form method="POST" action="/add-fee">

        <label>Student Name:</label><br>
        <input type="text" name="student_name" required>
        <br><br>

        <label>Enrollment Number:</label><br>
        <input type="text" name="enrollment_no" required>
        <br><br>

        <label>Course:</label><br>
        <input type="text" name="course" required>
        <br><br>

        <label>Total Fees:</label><br>
        <input type="number" name="total_fees" min="0" step="0.01" required>
        <br><br>

        <label>Paid Fees:</label><br>
        <input type="number" name="paid_fees" min="0" step="0.01" required>
        <br><br>

        <button type="submit">Save Fee Record</button>

    </form>

    <br>

    <a href="/fees">Back to Fees Management</a>

</body>
</html>
