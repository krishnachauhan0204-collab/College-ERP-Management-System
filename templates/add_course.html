<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Course / Subject</title>
</head>

<body>

    <h1>Add Course / Subject</h1>

    <form method="POST" action="/add-course">

        <label>Department:</label><br>
        <input type="text" name="department"
               placeholder="e.g. Computer Engineering" required>
        <br><br>

        <label>Course / Subject Name:</label><br>
        <input type="text" name="course_name"
               placeholder="e.g. Data Structures" required>
        <br><br>

        <label>Course Code:</label><br>
        <input type="text" name="course_code"
               placeholder="e.g. DS101" required>
        <br><br>

        <label>Semester:</label><br>
        <input type="text" name="semester"
               placeholder="e.g. 5" required>
        <br><br>

        <button type="submit">Save Course / Subject</button>

    </form>

    <br>

    <a href="/courses">Back to Courses & Subjects</a>

</body>
</html>
