<!DOCTYPE html>
<html>

<head>
    <title>College ERP Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>College ERP Management System</h1>

    <h2>🔐 Login</h2>

    <form method="POST">

        <p>
            <label>Username:</label><br>

            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   required>
        </p>

        <p>
            <label>Password:</label><br>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   required>
        </p>

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}

        <p style="color: red;">
            {{ error }}
        </p>

    {% endif %}

    <br>

    <p><b>Demo Login</b></p>

    <p>
        Admin: admin / admin123
    </p>

    <p>
        Faculty: faculty / faculty123
    </p>

    <p>
        Student: student / student123
    </p>

</body>

</html>
